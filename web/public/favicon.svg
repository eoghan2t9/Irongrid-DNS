<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Irongrid brand mark: a rounded square with a signal dot — the same
       shape family as the dashboard Logo, coloured for the browser tab. -->
  <defs>
    <linearGradient id="brand" x1="3" y1="21" x2="21" y2="3" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6b9af1"/>
      <stop offset="1" stop-color="#4a7fe8"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="18" height="18" rx="5" fill="url(#brand)"/>
  <circle cx="12" cy="12" r="4.5" fill="#fff"/>
</svg>
