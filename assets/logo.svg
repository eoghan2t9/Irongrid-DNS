<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64" role="img" aria-label="Irongrid DNS">
  <!-- Irongrid logo lockup: the brand mark (rounded square + signal dot)
       beside the wordmark, matching the README banner's typography. The
       navy text reads on light backgrounds (docs, install guides). -->
  <title>Irongrid DNS</title>
  <defs>
    <linearGradient id="brand" x1="8" y1="56" x2="56" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6b9af1"/>
      <stop offset="1" stop-color="#4a7fe8"/>
    </linearGradient>
  </defs>
  <g transform="translate(8 8)">
    <rect x="0" y="0" width="48" height="48" rx="10" fill="url(#brand)"/>
    <circle cx="24" cy="24" r="9" fill="#fff"/>
  </g>
  <text x="72" y="42" font-family="SFMono-Regular, Consolas, monospace" font-size="34" font-weight="700" fill="#0b1220">IRONGRID</text>
  <text x="240" y="42" font-family="SFMono-Regular, Consolas, monospace" font-size="34" font-weight="700" fill="#4a7fe8">DNS</text>
</svg>
