<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Irongrid DNS — fast, private, self-hosted, ad-blocking DNS server">
  <title>Irongrid DNS — fast, private, self-hosted, ad-blocking DNS server</title>
  <defs>
    <style>
      /* Static appearance by default — identical to the non-animated banner.
         Motion is added only for users who have not asked for reduced motion. */
      .packet, .sonar, .caret, .shineband { display: none; }

      @media (prefers-reduced-motion: no-preference) {
        .packet, .sonar, .caret, .shineband { display: block; }

        /* breathing ambient glow behind the headline */
        .glow-anim { animation: breathe 5s ease-in-out infinite; }
        @keyframes breathe {
          0%, 100% { opacity: 0.55; }
          50%      { opacity: 1; }
        }

        /* energy flowing along the query path */
        .flow { stroke-dasharray: 6 10; animation: flow 1.4s linear infinite; }
        @keyframes flow { to { stroke-dashoffset: -16; } }

        /* DNS packets travelling client → filter → cache / upstream */
        .packet { animation: travel 1.8s linear infinite; }
        .packet.p2 { animation-delay: 0.9s; }
        @keyframes travel {
          from { offset-distance: 0%; }
          to   { offset-distance: 100%; }
        }

        /* sonar ping radiating from the filter engine */
        .sonar {
          transform-box: fill-box;
          transform-origin: center;
          animation: ping 2.2s ease-out infinite;
        }
        .sonar.s2 { animation-delay: 1.1s; }
        @keyframes ping {
          0%   { transform: scale(1);   opacity: 0.7; }
          100% { transform: scale(2.8); opacity: 0; }
        }

        /* soft pulse on the blocked ✕ */
        .pulse-x { animation: softpulse 2.4s ease-in-out infinite; }
        @keyframes softpulse {
          0%, 100% { opacity: 0.7; }
          50%      { opacity: 1; }
        }

        /* gloss sweep across the wordmark */
        .shineband { animation: sweep 5s ease-in-out infinite; }
        @keyframes sweep {
          0%   { transform: translateX(-620px); }
          100% { transform: translateX(1120px); }
        }

        /* the terminal types the dig command, then the answer fades in */
        .digline {
          clip-path: inset(0 100% 0 0);
          animation: type 0.9s steps(28) 0.4s both;
        }
        @keyframes type { to { clip-path: inset(0 0 0 0); } }

        .caret { animation: blink 1.06s steps(2, start) infinite; }
        @keyframes blink { to { visibility: hidden; } }

        .resp {
          opacity: 0;
          animation: fadein 0.5s ease-out 1.8s both;
        }
        @keyframes fadein { to { opacity: 1; } }
      }

      /* reduced motion: show the finished, static frame */
      @media (prefers-reduced-motion: reduce) {
        .resp { display: block; opacity: 1; }
      }
    </style>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#181818" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="38%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#4a90e2" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#4a90e2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shineBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="titleClip">
      <text x="60" y="152" font-family="SFMono-Regular, Consolas, monospace" font-size="60" font-weight="700">IRONGRID</text>
      <text x="372" y="152" font-family="SFMono-Regular, Consolas, monospace" font-size="60" font-weight="700">DNS</text>
    </clipPath>
  </defs>

  <rect width="1200" height="340" fill="#0a0a0a"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <rect class="glow-anim" width="1200" height="340" fill="url(#glow)"/>

  <!-- faint corner circuit decoration -->
  <path d="M 0 0 L 90 0 L 90 60" fill="none" stroke="#1f1f1f" stroke-width="2"/>
  <circle cx="90" cy="60" r="4" fill="#1f1f1f"/>
  <path d="M 1200 340 L 1110 340 L 1110 280" fill="none" stroke="#1f1f1f" stroke-width="2"/>
  <circle cx="1110" cy="280" r="4" fill="#1f1f1f"/>

  <!-- query path motif: client -> filter -> cache, filter -> upstream; blocked at the filter -->
  <g>
    <line class="flow" x1="860" y1="105" x2="975" y2="105" stroke="#2fa84f" stroke-width="2"/>
    <line class="flow" x1="975" y1="105" x2="1090" y2="105" stroke="#d99a1b" stroke-width="2"/>
    <line class="flow" x1="975" y1="105" x2="1090" y2="185" stroke="#4a90e2" stroke-width="1.5" opacity="0.75"/>
  </g>

  <!-- sonar pings from the filter engine -->
  <circle class="sonar" cx="975" cy="105" r="7" fill="none" stroke="#4a90e2" stroke-width="2.5"/>
  <circle class="sonar s2" cx="975" cy="105" r="7" fill="none" stroke="#4a90e2" stroke-width="2.5"/>

  <!-- DNS packets in flight -->
  <circle class="packet" r="4" fill="#2fa84f" style="offset-path:path('M 860 105 L 975 105')"/>
  <circle class="packet p2" r="4" fill="#2fa84f" style="offset-path:path('M 860 105 L 975 105')"/>
  <circle class="packet" r="4" fill="#d99a1b" style="offset-path:path('M 975 105 L 1090 105')"/>
  <circle class="packet p2" r="4" fill="#d99a1b" style="offset-path:path('M 975 105 L 1090 105')"/>
  <circle class="packet" r="4" fill="#4a90e2" style="offset-path:path('M 975 105 L 1090 185')"/>
  <circle class="packet p2" r="4" fill="#4a90e2" style="offset-path:path('M 975 105 L 1090 185')"/>

  <!-- nodes -->
  <circle cx="860" cy="105" r="7" fill="#2fa84f"/>
  <circle cx="975" cy="105" r="9" fill="#4a90e2"/>
  <circle cx="1090" cy="105" r="7" fill="#d99a1b"/>
  <circle cx="1090" cy="185" r="7" fill="#8f8f8b"/>
  <g class="pulse-x">
    <path d="M 912 100 L 922 110 M 922 100 L 912 110" stroke="#d0453f" stroke-width="2.5"/>
  </g>
  <text x="917" y="86" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="11" fill="#d0453f">blocked</text>
  <text x="860" y="130" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="11" fill="#8f8f8b">client</text>
  <text x="975" y="130" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="11" fill="#8f8f8b">filter</text>
  <text x="1090" y="130" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="11" fill="#8f8f8b">cache</text>
  <text x="1090" y="208" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="11" fill="#8f8f8b">upstream</text>

  <!-- headline -->
  <text x="60" y="88" font-family="SFMono-Regular, Consolas, monospace" font-size="13" letter-spacing="4" fill="#8f8f8b">SELF-HOSTED · AD-BLOCKING · PRIVATE</text>
  <text x="60" y="152" font-family="SFMono-Regular, Consolas, monospace" font-size="60" font-weight="700" fill="#e6e6e4">IRONGRID</text>
  <text x="372" y="152" font-family="SFMono-Regular, Consolas, monospace" font-size="60" font-weight="700" fill="#4a90e2">DNS</text>
  <!-- gloss sweep, clipped to the wordmark glyphs -->
  <g clip-path="url(#titleClip)" aria-hidden="true">
    <rect class="shineband" x="0" y="60" width="520" height="110" fill="url(#shineBand)"/>
  </g>
  <text x="62" y="190" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#8f8f8b">Fast, private, self-hosted DNS — sub-millisecond answers on every modern protocol.</text>

  <!-- protocol chips -->
  <g font-family="SFMono-Regular, Consolas, monospace" font-size="13">
    <rect x="60" y="208" width="84" height="30" rx="15" fill="#151515" stroke="#2a2a2a" stroke-width="1"/>
    <text x="102" y="227" text-anchor="middle" fill="#e6e6e4">UDP 53</text>
    <rect x="154" y="208" width="84" height="30" rx="15" fill="#151515" stroke="#2a2a2a" stroke-width="1"/>
    <text x="196" y="227" text-anchor="middle" fill="#e6e6e4">TCP 53</text>
    <rect x="248" y="208" width="88" height="30" rx="15" fill="#151515" stroke="#3a5a8a" stroke-width="1"/>
    <text x="292" y="227" text-anchor="middle" fill="#4a90e2">DoT 853</text>
    <rect x="346" y="208" width="88" height="30" rx="15" fill="#151515" stroke="#3a5a8a" stroke-width="1"/>
    <text x="390" y="227" text-anchor="middle" fill="#4a90e2">DoH 443</text>
    <rect x="444" y="208" width="88" height="30" rx="15" fill="#151515" stroke="#3a5a8a" stroke-width="1"/>
    <text x="488" y="227" text-anchor="middle" fill="#4a90e2">DoQ 853</text>
  </g>

  <!-- terminal window -->
  <rect x="60" y="252" width="1080" height="76" rx="10" fill="#121212" stroke="#2a2a2a" stroke-width="1"/>
  <circle cx="82" cy="272" r="5" fill="#d0453f"/>
  <circle cx="100" cy="272" r="5" fill="#d99a1b"/>
  <circle cx="118" cy="272" r="5" fill="#2fa84f"/>
  <text x="136" y="277" font-family="SFMono-Regular, Consolas, monospace" font-size="12" fill="#626260">irongrid — DNS hot path</text>
  <text class="digline" x="82" y="300" font-family="SFMono-Regular, Consolas, monospace" font-size="15" fill="#e6e6e4">$ dig @localhost ads.example.com</text>
  <rect class="caret" x="363" y="287" width="8" height="15" rx="1" fill="#e6e6e4"/>
  <text class="resp" x="82" y="320" font-family="SFMono-Regular, Consolas, monospace" font-size="15">
    <tspan fill="#d0453f">→ blocked</tspan>
    <tspan fill="#8f8f8b"> (nxdomain) · </tspan>
    <tspan fill="#d99a1b">0.4 ms</tspan>
    <tspan fill="#8f8f8b"> · list oisd</tspan>
  </text>
</svg>
