# golangci-lint v2 configuration.
# Docs: https://golangci-lint.run/  ·  version pinned in the Makefile and CI.
version: "2"

linters:
  # none keeps the set explicit — enable exactly what we want below.
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - modernize
    # staticcheck disabled (temporary): its bundled honnef.co/go/tools
    # v0.8.0-rc.1 nilness pass panics ("unhandled builtin recover") building
    # IR for sentry-go under the go1.27 compiler — reproduces on both
    # golangci-lint v2.12.2 (crashes on stdlib itself, worse) and v2.13.0
    # (crashes narrower, on sentry-go's recover() pattern). Not our code;
    # go-tools hasn't caught up with go1.27 yet (go1.27 and go-tools
    # v0.8.0-rc.1 both shipped within the same week). Re-enable once
    # honnef.co/go/tools ships a go1.27-compatible release.
    - unused
    - misspell
    - gosec
  settings:
    staticcheck:
      checks: ["all"]
  exclusions:
    # Lax: files carrying a "Code generated ... DO NOT EDIT" header are skipped.
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # G115 (integer-overflow conversions) here is bounded by construction —
      # cache-entry timestamps, DNS's 64 KB message limit and cgroup memory
      # sizes never approach the flagged integer boundaries. Audited rather
      # than patched with widening casts that add no safety.
      - linters:
          - gosec
        text: "integer overflow conversion"
      # G404 (math/rand) in bench tools is deliberate: dnsload and
      # udpsockets only use it to jitter the query-name mix so load looks
      # realistic. crypto/rand would add a blocking entropy pull to the hot
      # path for zero security benefit.
      - path: bench/
        linters:
          - gosec
        text: "weak random number generator"
      # Test helpers intentionally exercise odd patterns (fuzzing payloads,
      # miniredis, fake servers) — don't flag them.
      - path: (.+)_test\.go
        linters:
          - gosec
      # G204 (subprocess with variable args) for the cloudflared launcher is
      # by design: binPath is the manager's own pinned install path (never
      # user input), and args come from buildArgs, which only ever emits
      # flags built from the validated mode/token/config/origin the tunnel
      # was started with.
      - path: internal/tunnel/tunnel\.go
        linters:
          - gosec
        text: "Subprocess launched with a potential tainted input or cmd arguments"

run:
  timeout: 5m
