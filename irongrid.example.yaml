# Irongrid DNS configuration
# Copy to irongrid.yaml and adjust. The server generates a default config on
# first run if none exists.

server:
  listen_udp: "0.0.0.0:53"     # plain DNS over UDP ("" disables)
  listen_tcp: "0.0.0.0:53"     # plain DNS over TCP
  listen_dot: "0.0.0.0:853"    # DNS over TLS
  listen_doh: "0.0.0.0:443"    # DNS over HTTPS (TCP)
  # listen_doh3: "0.0.0.0:443"  # DNS over HTTP/3 (RFC 9114) — the same
                                 # /dns-query endpoint over QUIC (UDP 443,
                                 # independent of TCP 443). 0-RTT + full
                                 # multiplexing make it the fastest transport
                                 # for mobile/roaming clients. Must differ
                                 # from listen_doq (different ALPNs can't
                                 # share one UDP port).
  listen_doq: "0.0.0.0:853"    # DNS over QUIC
  doh_path: "/dns-query"       # RFC 8484 path
  # padding: true               # pad responses on DoT/DoH/DoH3/DoQ to 128-byte
                                 # blocks (RFC 7830) so message lengths don't
                                 # reveal the queried domain
  # cookies: true               # server DNS cookies (RFC 7873): client cookies
                                 # are echoed with an HMAC server cookie bound
                                 # to the client IP; forged cookies get
                                 # BADCOOKIE — blunts off-path spoofing on the
                                 # public UDP listener
  # Set web_listen to the DoH port (0.0.0.0:443) with web_tls to serve the
  # dashboard and DoH on ONE HTTPS port — open it at https://your-domain
  # with no port suffix (/dns-query keeps serving DoH).
  web_listen: "0.0.0.0:8080"   # dashboard + REST API (or 0.0.0.0:443 to share with DoH)
  # web_tls: true              # serve the dashboard over HTTPS (uses the TLS cert; required when sharing the DoH port)
  # web_redirect: true         # with web_tls: plain HTTP on web_redirect_port 301s to HTTPS
  # web_redirect_port: 80
  timeout_sec: 5               # per-query upstream timeout
  # MaxTCPConnsPerIP caps how many concurrent connections one client IP
  # may hold on the plain-TCP and DoT listeners (0 = unlimited).
  # It stops connection floods and slowloris-style attacks from
  # exhausting file descriptors and goroutines.
  max_tcp_conns_per_ip: 100
  # MaxHTTPConnsPerIP caps how many concurrent connections one client IP
  # may hold on the DoH listener (0 = unlimited).
  max_http_conns_per_ip: 100
  # UDP sockets bound for the plain UDP, DoQ and DoH3 listeners
  # (SO_REUSEPORT spreads incoming datagrams across them). 0 = auto (one per
  # CPU, capped at 8); 1 = a single exclusive socket (no port sharing with
  # other processes); N = exactly N sockets (capped at 64).
  udp_sockets: 4
  # Handler workers per plain-UDP socket (the worker pool replaces
  # goroutine-per-datagram, so a flood costs no goroutine churn). 0 = auto
  # (4 x CPU per socket, floor 16, capped 256); N = exactly N per socket
  # (capped at 512).
  udp_workers: 64
  # debug_pprof: true            # expose Go's net/http/pprof under /debug/pprof/
                                 # on the dashboard port, behind the same admin
                                 # login as the REST API. Off by default: even
                                 # authenticated, a heap profile can dump memory
                                 # contents and a CPU/trace profile costs real
                                 # cycles for its duration — turn on only while
                                 # actively chasing a performance problem.
  # Reverse proxies in front of the DoH endpoint whose X-Forwarded-For
  # header is honored, in addition to loopback/private peers (local nginx /
  # Caddy, the baked-in cloudflared tunnel — always trusted). Without this,
  # DoH behind a public reverse proxy (CDN, edge box) sees only the proxy's
  # own address, so geo/ASN blocking, rate limiting and per-client policy
  # apply to the proxy instead of the end client. The direct peer must itself
  # be trusted (loopback/private or listed here) before XFF is read at all.
  # trusted_proxies:
  #   - "203.0.113.0/24"         # your CDN's egress range
  # xff_hop_limit: 1            # trusted proxy hops in the X-Forwarded-For
                                 # chain: the client IP is the hop_limit-th
                                 # entry from the right, so 1 (the default)
                                 # is the direct peer only, 2 is client →
                                 # CDN → nginx → Irongrid, etc.
  # doh_asn_header: true         # add X-Irongrid-Client-ASN to DoH responses:
                                 # the ASN the server attributes to the client's
                                 # IP (only when it matches a configured ASN
                                 # list — geo_block or a client group) — handy
                                 # for verifying which ISP a client resolves as

# Upstream DNS servers to forward to (udp, tcp, tls, https, quic supported).
upstreams:
  - "udp://1.1.1.1:53"
  - "udp://8.8.8.8:53"
  # - "tls://1.1.1.1:853"                  # DNS over TLS upstream
  # - "https://cloudflare-dns.com/dns-query" # DNS over HTTPS upstream
  # - "recursive://"                       # resolve from the root servers
  #                                         # yourself instead of forwarding —
  #                                         # no third-party resolver sees the
  #                                         # query, at the cost of slower
  #                                         # cold lookups and no upstream
  #                                         # DNSSEC validation to lean on
  #
  #   recursive:// root hints come from IANA's authoritative named.root
  #   (https://www.internic.net/domain/named.root), fetched at boot with its
  #   PGP signature and only trusted when the signature verifies against the
  #   embedded Verisign key. A verified copy is cached to data/root-hints.txt
  #   so offline restarts skip the network; the bundled hints are the final
  #   fallback. Hints re-fetch weekly while running, and the dashboard's
  #   Root hints card shows the source (live / cached / bundled) and
  #   signature state.

# Conditional (split-horizon) routing: queries for a domain subtree go to
# that route's own upstream set instead of the global list above — e.g. a
# LAN resolver that answers internal names, so *.lan queries never leak to
# public resolvers. A route matches its domain and every subdomain under it;
# the longest match wins when routes overlap, and a route overrides both the
# global upstreams and a client group's upstream override.
# upstream_routes:
#   - domain: "lan"
#     upstreams:
#       - "udp://192.168.1.1:53"
#   - domain: "corp.example.com"
#     upstreams:
#       - "tls://10.0.0.2:853"

# How multiple upstreams are queried for each resolution (global; also covers
# client-group upstream overrides):
#   race        (default) query them all at once — the fastest successful
#               answer wins, hiding slow or down resolvers
#   sequential  try them in list order, failing over to the next only when
#               the previous errors or answers SERVFAIL
# upstream_mode: race

# Proactive cache warmer: pre-caches the answers for every domain your
# network queried within `lookback` (from the query log), so a restart or
# cache flush doesn't leave the first query for each domain cold. A pass runs
# once at boot, then every `interval`. Only entries that are missing, expired
# or inside their serve-stale window get re-resolved (A + AAAA through your
# upstreams), so steady-state upstream traffic is low. Off by default because
# it uses upstreams even when nobody is asking.
warmer:
  enabled: true             # turn the background warmer on
  interval: 15m              # how often a pass runs
  lookback: 24h              # how far back into the query log to find active domains
  max_domains: 5000          # cap on domains warmed per pass (0 = all in the window)
  concurrency: 8             # parallel upstream resolutions per pass

cache:
  # Dragonfly is a HARD requirement: the server refuses to start without it.
  addr: "localhost:6379"
  password: ""                 # set if Dragonfly requires auth
  db: 0
  ttl: 6h                      # positive answer cache lifetime
  negative_ttl: 1m             # cached NXDOMAIN/SERVFAIL lifetime
  # In-process L1 cache in front of Dragonfly (an accelerator — hits skip the
  # Redis round-trip). 0 = auto-sized from the detected memory ceiling (the
  # default); -1 disables it; N = exact per-shard entry cap.
  l1_entries: 0
  serve_stale: 5m             # RFC 8767: keep entries answerable this long past
                              # their TTL so an upstream outage serves the last
                              # known good answer instead of SERVFAIL (0 disables)
  prefetch: true              # refresh hot entries in the background just before
                              # they expire, so the next query hits the cache
  lookup_timeout: 150ms       # max time a cache read may take on the DNS hot path
                              # before the query proceeds to the upstream
                              # (0 = built-in 150ms default)
  failure_ttl: 5s             # how long a resolution failure (upstream
                              # unreachable, no stale data) is cached as SERVFAIL so
                              # retries don't re-pay the full per-query timeout
                              # during an outage. Default 5s — much shorter than
                              # negative_ttl so a recovered upstream is visible
                              # quickly (0 = use negative_ttl)

# Tuning for recursive:// upstreams (no effect with forwarders).
recursive:
  # server_timeout: 3s        # how long one nameserver exchange may take during a
                              # referral walk (root -> TLD -> authoritative) before
                              # the resolver moves on (0 = built-in 3s default)


# dhcp:
#   enabled: true             # off by default — this host is usually the DNS
#                             # server, so it doubles as the LAN's DHCP server.
#                             # Only bind the NIC your LAN actually uses (below).
#   interface: eth0           # NIC to serve on; empty = all interfaces (careful
#                             # if the host has several NICs)
#   subnet: 192.168.1.0/24    # IPv4 network served (RFC 2131)
#   range_start: 192.168.1.100
#   range_end: 192.168.1.200  # dynamic pool
#   gateway: 192.168.1.1      # router option; empty = this server's own address
#   dns:                      # DNS option; empty = this server (the point!)
#     - 192.168.1.1
#   lease_time: 24h
#   domain: lan               # client hostnames resolve as <hostname>.lan and
#                             # bare <hostname> in the local DNS (Pi-hole style);
#                             # empty disables hostname resolution
#   static_leases:            # fixed addresses that never expire; MAC keys
#                             # DHCPv4, DUID keys DHCPv6
#     - mac: aa:bb:cc:dd:ee:ff
#       ip: 192.168.1.50
#       hostname: printer
#     - duid: 000100011234567890abcdef
#       ip: fd00::50
#       hostname: nas
#   ipv6: false               # also run DHCPv6 (RFC 8415 IA_NA + stateless DNS
#                             # options for SLAAC clients) on the same NIC
#   ipv6_prefix: fd00::/64
#   ipv6_range_start: fd00::100
#   ipv6_range_end: fd00::200


tls:
  cert_file: ""                # PEM cert chain for DoT/DoH/DoQ ("" = self-signed)
  key_file: ""
  generate_self_signed: true   # auto-create a self-signed cert when no cert given
  self_signed_hosts:
    - "localhost"
    - "dns.example.com"        # use your real hostname for Android Private DNS
  cert_dir: "data/certs"
  # acme:                      # Let's Encrypt auto-issuance (see README)
  #   enabled: false
  #   email: "you@example.com"
  #   domains: ["dns.example.com"]
  #   http01_port: 80
  #   dns01:                    # optional: issue via DNS TXT instead of HTTP-01
  #     provider: cloudflare    # cloudflare | digitalocean | hetzner | godaddy | route53
  #     cloudflare_token: ""    #   (provider-specific credentials below)
  #     digitalocean_token: ""
  #     hetzner_token: ""
  #     godaddy_key: ""
  #     godaddy_secret: ""
  #     aws_access_key_id: ""
  #     aws_secret_access_key: ""
  #     propagation_wait_sec: 60
  #     propagation_wait_sec: 60

filter:
  # What blocked queries receive: "nxdomain", "refused", or an IP like "0.0.0.0".
  block_response: "nxdomain"
  block_ttl: 600
  # How often every enabled blocklist refreshes itself — one interval for
  # all of them, not configured per list. "" or 0 disables auto-refresh.
  auto_update: 24h
  blocklists:
    # - id: "oisd"
    #   name: "OISD Big"
    #   url: "https://big.oisd.nl/"
    #   enabled: true
  whitelist: []                # always allow (overrides every blocklist)
  blacklist: []                # always block (domains, wildcards, IPs)
  # Check every CNAME hop an answer resolves through, not just the queried
  # name — catches trackers that hide behind a first-party-looking
  # subdomain CNAMEd to a blocklisted domain. Off by default: a CNAME chain
  # through a shared CDN could in principle collide with a broad blocklist
  # entry.
  cname_cloaking_protection: false

log:
  # The query log lives in Dragonfly (stream "irongrid:log"), not a file —
  # query_log_file is kept only for backward compatibility and is ignored.
  query_log_file: "data/querylog.db"
  retention_days: 30
  verbose: true
  # batch_size: 256            # entries per query-log stream flush (0 = default)

web:
  username: "admin"
  # Plaintext passwords are hashed automatically on first save.
  password: "change-me"
  # session_secret: ""          # auto-generated if empty

tunnel:
  enabled: false               # start the baked-in cloudflared on boot?
  token: ""                    # named tunnel token (Cloudflare Zero Trust)
  config_file: ""              # or point at a cloudflared YAML config
  quick_tunnel: false          # or use an unauthenticated trycloudflare.com tunnel
  quick_tunnel_url: "http://localhost:8080"
  hostname: "dns.example.com"

# Local DNS records: answer a domain yourself instead of forwarding it.
# Takes priority over blocklists and the cache. "*.suffix" covers a whole
# subtree; a CNAME rule answers any query type.
rewrites: []
  # - domain: "nas.home"
  #   type: "A"                 # A, AAAA or CNAME
  #   value: "192.168.1.10"
  #   ttl: 300

# Per-client policy: apply a different blocklist/upstream policy to clients
# whose source IP falls in one of a group's CIDRs. Groups are evaluated in
# order; the first match wins. Clients matching no group use the global
# filter/upstreams above.
client_groups: []
  # - id: "kids"
  #   name: "Kids' devices"
  #   enabled: true
  #   cidrs: ["192.168.1.50", "192.168.1.51"]  # bare IPs or CIDRs
  #   asns: ["AS13335"]        # match clients by ISP instead of (or in
  #                             # addition to) CIDR; uses the same ip2asn
  #                             # dataset as geo_block
  #   blocklists: []           # subset of filter.blocklists IDs; [] = all enabled
  #   whitelist: []            # added to the global whitelist
  #   blacklist: ["*.tiktok.com", "*.reddit.com"]
  #   upstreams: []            # override the global upstreams; [] = use them

# Per-client-IP rate limiting — a defense against a compromised LAN device
# or a public listener being used for DNS amplification.
rate_limit:
  enabled: false
  qps: 20                      # sustained queries/sec allowed per client IP
  burst: 40                    # short-burst allowance above qps (must be >= qps)

# Country + client-IP blocking. Country data is fetched automatically from
# ipverse/rir-ip and IP→ASN mapping from iptoasn.com (both free, no account
# or API key) and cached under the data dir. The same lists are installed
# into the host firewall (nftables, or iptables + ipset) so new inbound
# traffic from blocked countries/IPs/ISPs is dropped at the packet level —
# run Irongrid as root (or with CAP_NET_ADMIN) for that.
geo_block:
  enabled: false
  countries: []              # ISO 3166-1 alpha-2 codes, e.g. RU, CN, KP
  # ips: []                  # always-blocked client IPs/CIDRs, e.g. known
                              # proxy-exit ranges like "38.11.0.0/17" — refused
                              # by DNS and dropped by the firewall
  # honeypots: []            # trap domains: any client that queries one —
                              # or any subdomain under it, since floods
                              # randomise the first label — over a
                              # connection-oriented transport (TCP/DoT/DoH/
                              # DoQ) is auto-blocked (persisted to
                              # data/geo/blocked-ips.txt) and dropped at the
                              # firewall; unblock via the dashboard. Plain-
                              # UDP hits are silently dropped (never
                              # answered — replying would amplify a spoofed
                              # flood) and never auto-block unless
                              # honeypot_udp_block or trust_udp is set.
                              # Trap traffic is not written to the query
                              # log. Requires geo_block.enabled to take
                              # effect
  # trust_udp: false          # opt-in: auto-block the source of plain-UDP
                              # honeypot hits too, permanently (persisted +
                              # firewall drop). OFF by default — UDP
                              # sources can be spoofed, so enabling this
                              # lets a spoofing attacker permanently block
                              # an innocent victim; only for trusted networks
  # honeypot_udp_block: 10m   # bounded middle ground: auto-block the source
                              # of a plain-UDP honeypot hit for this window
                              # via the rate limiter (expires on its own,
                              # visible + unblockable on the dashboard) —
                              # a spoofed packet can only block a victim
                              # for the window, never forever. Requires
                              # rate_limit.enabled; 0/omitted disables
  allowlist: []              # client IPs/CIDRs that are never blocked — not by
                              # country geo-blocking, the explicit IP list, or
                              # honeypot auto-blocks (put your own servers here)
  # allow_asns: []           # ISPs (by ASN, e.g. "AS13335" or "13335") whose
                              # clients are never blocked — same guarantee as
                              # the allowlist, but for a whole ISP. IP→ASN
                              # mapping comes from the free ip2asn dataset
                              # (iptoasn.com), fetched and cached like the
                              # country lists
  # block_asns: []           # ISPs whose clients are always refused
                              # regardless of country (like ips, but covering
                              # the whole ISP); their ranges also feed the
                              # host firewall
  # base_url: ""             # override the CIDR data source (default
                              # ipverse/rir-ip; file:// paths supported)
  # asn_base_url: ""         # override the ip2asn data source (default
                              # iptoasn.com; file:// paths supported). Like
                              # base_url it is read at boot — changing it
                              # requires a restart
  auto_update: 168h          # how often country data re-fetches (0 = never)

# Free threat-intel integrations for reporting the attacker IPs Irongrid
# blocks (see the Blocked clients card on the dashboard).
abuse:
  # abuseipdb_key: ""        # AbuseIPDB API key (free account at
                              # abuseipdb.com) — enables one-click reporting
                              # of honeypot-confirmed attackers (DDoS
                              # category) from the dashboard. Free tier:
                              # 1,000 checks/reports per day, one report per
                              # IP per 15 min. The CSV export and ⓘ ASN
                              # lookups (free RIPEstat) need no key.

# DNSSEC: Irongrid is a forwarding resolver — like Pi-hole, AdGuard Home and
# dnsmasq, it trusts an upstream that already validates rather than building
# its own root-of-trust chain validator. Enabling this sets the DO bit on
# upstream queries and (with require_ad) rejects answers the upstream didn't
# mark authenticated. Only meaningful with an ENCRYPTED upstream (tls://,
# https:// or quic://) — over plain udp/tcp the AD bit can be stripped or
# forged in transit.
dnssec:
  enabled: false
  require_ad: true
