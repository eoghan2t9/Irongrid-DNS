# Irongrid DNS configuration
# Copy to irongrid.yaml and adjust. The server generates a default config on
# first run if none exists.

server:
  listen_udp: "0.0.0.0:53"     # plain DNS over UDP ("" disables)
  listen_tcp: "0.0.0.0:53"     # plain DNS over TCP
  listen_dot: "0.0.0.0:853"    # DNS over TLS
  listen_doh: "0.0.0.0:443"    # DNS over HTTPS
  listen_doq: "0.0.0.0:853"    # DNS over QUIC
  doh_path: "/dns-query"       # RFC 8484 path
  # Set web_listen to the DoH port (0.0.0.0:443) with web_tls to serve the
  # dashboard and DoH on ONE HTTPS port — open it at https://your-domain
  # with no port suffix (/dns-query keeps serving DoH).
  web_listen: "0.0.0.0:8080"   # dashboard + REST API (or 0.0.0.0:443 to share with DoH)
  # web_tls: true              # serve the dashboard over HTTPS (uses the TLS cert; required when sharing the DoH port)
  # web_redirect: true         # with web_tls: plain HTTP on web_redirect_port 301s to HTTPS
  # web_redirect_port: 80
  timeout_sec: 5               # per-query upstream timeout

# Upstream DNS servers to forward to (udp, tcp, tls, https, quic supported).
upstreams:
  - "udp://1.1.1.1:53"
  - "udp://8.8.8.8:53"
  # - "tls://1.1.1.1:853"                  # DNS over TLS upstream
  # - "https://cloudflare-dns.com/dns-query" # DNS over HTTPS upstreamcache:
  # Dragonfly is a HARD requirement: the server refuses to start without it.
  addr: "localhost:6379"
  password: ""                 # set if Dragonfly requires auth
  db: 0
  ttl: 6h                      # positive answer cache lifetime
  negative_ttl: 1m             # cached NXDOMAIN/SERVFAIL lifetime
  # l1_entries: 512            # per-shard size of the in-process L1 cache in
                               # front of Dragonfly (0 disables it; hits then
                               # always round-trip to Redis)

tls:
  cert_file: ""                # PEM cert chain for DoT/DoH/DoQ ("" = self-signed)
  key_file: ""
  generate_self_signed: true   # auto-create a self-signed cert when no cert given
  self_signed_hosts:
    - "localhost"
    - "dns.example.com"        # use your real hostname for Android Private DNS
  cert_dir: "data/certs"
  # acme:                      # Let's Encrypt auto-issuance (see README)
  #   enabled: false
  #   email: "you@example.com"
  #   domains: ["dns.example.com"]
  #   http01_port: 80
  #   dns01:                    # optional: issue via DNS TXT instead of HTTP-01
  #     provider: cloudflare    # cloudflare | digitalocean | hetzner | godaddy | route53
  #     cloudflare_token: ""    #   (provider-specific credentials below)
  #     digitalocean_token: ""
  #     hetzner_token: ""
  #     godaddy_key: ""
  #     godaddy_secret: ""
  #     aws_access_key_id: ""
  #     aws_secret_access_key: ""
  #     propagation_wait_sec: 60
  #     propagation_wait_sec: 60

filter:
  # What blocked queries receive: "nxdomain", "refused", or an IP like "0.0.0.0".
  block_response: "nxdomain"
  block_ttl: 600
  blocklists:
    # - id: "oisd"
    #   name: "OISD Big"
    #   url: "https://big.oisd.nl/"
    #   enabled: true
    #   auto_update: 24h
  whitelist: []                # always allow (overrides every blocklist)
  blacklist: []                # always block (domains, wildcards, IPs)

log:
  query_log_file: "data/querylog.db"
  retention_days: 30
  verbose: true
  # batch_size: 256            # entries per query-log transaction (0 = default)

web:
  username: "admin"
  # Plaintext passwords are hashed automatically on first save.
  password: "change-me"
  # session_secret: ""          # auto-generated if empty

tunnel:
  enabled: false               # start the baked-in cloudflared on boot?
  token: ""                    # named tunnel token (Cloudflare Zero Trust)
  config_file: ""              # or point at a cloudflared YAML config
  quick_tunnel: false          # or use an unauthenticated trycloudflare.com tunnel
  quick_tunnel_url: "http://localhost:8080"
  hostname: "dns.example.com"
