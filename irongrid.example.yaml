# Irongrid DNS configuration
# Copy to irongrid.yaml and adjust. The server generates a default config on
# first run if none exists.

server:
  listen_udp: "0.0.0.0:53"     # plain DNS over UDP ("" disables)
  listen_tcp: "0.0.0.0:53"     # plain DNS over TCP
  listen_dot: "0.0.0.0:853"    # DNS over TLS
  listen_doh: "0.0.0.0:443"    # DNS over HTTPS
  listen_doq: "0.0.0.0:853"    # DNS over QUIC
  doh_path: "/dns-query"       # RFC 8484 path
  # Set web_listen to the DoH port (0.0.0.0:443) with web_tls to serve the
  # dashboard and DoH on ONE HTTPS port — open it at https://your-domain
  # with no port suffix (/dns-query keeps serving DoH).
  web_listen: "0.0.0.0:8080"   # dashboard + REST API (or 0.0.0.0:443 to share with DoH)
  # web_tls: true              # serve the dashboard over HTTPS (uses the TLS cert; required when sharing the DoH port)
  # web_redirect: true         # with web_tls: plain HTTP on web_redirect_port 301s to HTTPS
  # web_redirect_port: 80
  timeout_sec: 5               # per-query upstream timeout

# Upstream DNS servers to forward to (udp, tcp, tls, https, quic supported).
upstreams:
  - "udp://1.1.1.1:53"
  - "udp://8.8.8.8:53"
  # - "tls://1.1.1.1:853"                  # DNS over TLS upstream
  # - "https://cloudflare-dns.com/dns-query" # DNS over HTTPS upstream
  # - "recursive://"                       # resolve from the root servers
  #                                         # yourself instead of forwarding —
  #                                         # no third-party resolver sees the
  #                                         # query, at the cost of slower
  #                                         # cold lookups and no upstream
  #                                         # DNSSEC validation to lean on
  #
  #   recursive:// root hints come from IANA's authoritative named.root
  #   (https://www.internic.net/domain/named.root), fetched at boot with its
  #   PGP signature and only trusted when the signature verifies against the
  #   embedded Verisign key. A verified copy is cached to data/root-hints.txt
  #   so offline restarts skip the network; the bundled hints are the final
  #   fallback. Hints re-fetch weekly while running, and the dashboard's
  #   Root hints card shows the source (live / cached / bundled) and
  #   signature state.

cache:
  # Dragonfly is a HARD requirement: the server refuses to start without it.
  addr: "localhost:6379"
  password: ""                 # set if Dragonfly requires auth
  db: 0
  ttl: 6h                      # positive answer cache lifetime
  negative_ttl: 1m             # cached NXDOMAIN/SERVFAIL lifetime  l1_entries: 4096             # per-shard size of the in-process L1 cache in
                              # front of Dragonfly (0 disables it; hits then
                              # always round-trip to Redis)
  serve_stale: 5m             # RFC 8767: keep entries answerable this long past
                              # their TTL so an upstream outage serves the last
                              # known good answer instead of SERVFAIL (0 disables)
  prefetch: true              # refresh hot entries in the background just before
                              # they expire, so the next query hits the cache
  lookup_timeout: 150ms       # max time a cache read may take on the DNS hot path
                              # before the query proceeds to the upstream
                              # (0 = built-in 150ms default)


tls:
  cert_file: ""                # PEM cert chain for DoT/DoH/DoQ ("" = self-signed)
  key_file: ""
  generate_self_signed: true   # auto-create a self-signed cert when no cert given
  self_signed_hosts:
    - "localhost"
    - "dns.example.com"        # use your real hostname for Android Private DNS
  cert_dir: "data/certs"
  # acme:                      # Let's Encrypt auto-issuance (see README)
  #   enabled: false
  #   email: "you@example.com"
  #   domains: ["dns.example.com"]
  #   http01_port: 80
  #   dns01:                    # optional: issue via DNS TXT instead of HTTP-01
  #     provider: cloudflare    # cloudflare | digitalocean | hetzner | godaddy | route53
  #     cloudflare_token: ""    #   (provider-specific credentials below)
  #     digitalocean_token: ""
  #     hetzner_token: ""
  #     godaddy_key: ""
  #     godaddy_secret: ""
  #     aws_access_key_id: ""
  #     aws_secret_access_key: ""
  #     propagation_wait_sec: 60
  #     propagation_wait_sec: 60

filter:
  # What blocked queries receive: "nxdomain", "refused", or an IP like "0.0.0.0".
  block_response: "nxdomain"
  block_ttl: 600
  # How often every enabled blocklist refreshes itself — one interval for
  # all of them, not configured per list. "" or 0 disables auto-refresh.
  auto_update: 24h
  blocklists:
    # - id: "oisd"
    #   name: "OISD Big"
    #   url: "https://big.oisd.nl/"
    #   enabled: true
  whitelist: []                # always allow (overrides every blocklist)
  blacklist: []                # always block (domains, wildcards, IPs)

log:
  # The query log lives in Dragonfly (stream "irongrid:log"), not a file —
  # query_log_file is kept only for backward compatibility and is ignored.
  query_log_file: "data/querylog.db"
  retention_days: 30
  verbose: true
  # batch_size: 256            # entries per query-log stream flush (0 = default)

web:
  username: "admin"
  # Plaintext passwords are hashed automatically on first save.
  password: "change-me"
  # session_secret: ""          # auto-generated if empty

tunnel:
  enabled: false               # start the baked-in cloudflared on boot?
  token: ""                    # named tunnel token (Cloudflare Zero Trust)
  config_file: ""              # or point at a cloudflared YAML config
  quick_tunnel: false          # or use an unauthenticated trycloudflare.com tunnel
  quick_tunnel_url: "http://localhost:8080"
  hostname: "dns.example.com"

# Local DNS records: answer a domain yourself instead of forwarding it.
# Takes priority over blocklists and the cache. "*.suffix" covers a whole
# subtree; a CNAME rule answers any query type.
rewrites: []
  # - domain: "nas.home"
  #   type: "A"                 # A, AAAA or CNAME
  #   value: "192.168.1.10"
  #   ttl: 300

# Per-client policy: apply a different blocklist/upstream policy to clients
# whose source IP falls in one of a group's CIDRs. Groups are evaluated in
# order; the first match wins. Clients matching no group use the global
# filter/upstreams above.
client_groups: []
  # - id: "kids"
  #   name: "Kids' devices"
  #   enabled: true
  #   cidrs: ["192.168.1.50", "192.168.1.51"]  # bare IPs or CIDRs
  #   blocklists: []           # subset of filter.blocklists IDs; [] = all enabled
  #   whitelist: []            # added to the global whitelist
  #   blacklist: ["*.tiktok.com", "*.reddit.com"]
  #   upstreams: []            # override the global upstreams; [] = use them

# Per-client-IP rate limiting — a defense against a compromised LAN device
# or a public listener being used for DNS amplification.
rate_limit:
  enabled: false
  qps: 20                      # sustained queries/sec allowed per client IP
  burst: 40                    # short-burst allowance above qps (must be >= qps)

# Country + client-IP blocking. Country data is fetched automatically from
# ipverse/rir-ip (no account or API key) and cached under the data dir. The
# same lists are installed into the host firewall (nftables, or iptables +
# ipset) so new inbound traffic from blocked countries/IPs is dropped at the
# packet level — run Irongrid as root (or with CAP_NET_ADMIN) for that.
geo_block:
  enabled: false
  countries: []              # ISO 3166-1 alpha-2 codes, e.g. RU, CN, KP
  # ips: []                  # always-blocked client IPs/CIDRs, e.g. known
                              # proxy-exit ranges like "38.11.0.0/17" — refused
                              # by DNS and dropped by the firewall
  # honeypots: []            # trap domains: any client that queries one —
                              # or any subdomain under it, since floods
                              # randomise the first label — over a
                              # connection-oriented transport (TCP/DoT/DoH/
                              # DoQ) is auto-blocked (persisted to
                              # data/geo/blocked-ips.txt) and dropped at the
                              # firewall; unblock via the dashboard. UDP
                              # queries are refused but never auto-block —
                              # UDP sources can be spoofed. Trap traffic is
                              # not written to the query log. Requires
                              # geo_block.enabled to take effect
  # trust_udp: false          # opt-in: auto-block the source of plain-UDP
                              # honeypot hits too. OFF by default — UDP
                              # sources can be spoofed, so enabling this
                              # lets a spoofing attacker permanently block
                              # an innocent victim; only for trusted networks
  allowlist: []              # client IPs/CIDRs that are never blocked — not by
                              # country geo-blocking, the explicit IP list, or
                              # honeypot auto-blocks (put your own servers here)
  # base_url: ""             # override the CIDR data source (default
                              # ipverse/rir-ip; file:// paths supported)
  auto_update: 168h          # how often country data re-fetches (0 = never)

# Free threat-intel integrations for reporting the attacker IPs Irongrid
# blocks (see the Blocked clients card on the dashboard).
abuse:
  # abuseipdb_key: ""        # AbuseIPDB API key (free account at
                              # abuseipdb.com) — enables one-click reporting
                              # of honeypot-confirmed attackers (DDoS
                              # category) from the dashboard. Free tier:
                              # 1,000 checks/reports per day, one report per
                              # IP per 15 min. The CSV export and ⓘ ASN
                              # lookups (free RIPEstat) need no key.

# DNSSEC: Irongrid is a forwarding resolver — like Pi-hole, AdGuard Home and
# dnsmasq, it trusts an upstream that already validates rather than building
# its own root-of-trust chain validator. Enabling this sets the DO bit on
# upstream queries and (with require_ad) rejects answers the upstream didn't
# mark authenticated. Only meaningful with an ENCRYPTED upstream (tls://,
# https:// or quic://) — over plain udp/tcp the AD bit can be stripped or
# forged in transit.
dnssec:
  enabled: false
  require_ad: true
