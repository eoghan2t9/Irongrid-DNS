services:
  irongrid-dns:
    build: .
    container_name: irongrid-dns
    restart: unless-stopped
    ports:
      - "53:53/udp"      # plain DNS over UDP
      - "53:53/tcp"      # plain DNS over TCP
      - "853:853/tcp"    # DNS over TLS
      - "853:853/udp"    # DNS over QUIC
      - "443:443/tcp"    # DNS over HTTPS
      - "8080:8080/tcp"  # web dashboard + API
    volumes:
      - ./irongrid.yaml:/app/irongrid.yaml:ro
      - irongrid-data:/data
    depends_on:
      - dragonfly
    environment:
      - TZ=UTC
    cap_add:
      - NET_BIND_SERVICE   # allow binding to port 53 as non-root
    # Let the 2 MiB DNS socket buffers actually take effect: the kernel
    # clamps SO_RCVBUF/SO_SNDBUF to net.core.rmem_max/wmem_max (default
    # ~208 KiB), and the daemon applies these namespace sysctls at container
    # start, so no CAP_NET_ADMIN is needed inside. ulimits covers the low
    # default file-descriptor soft limit (1024) for the container's runs.
    sysctls:
      - net.core.rmem_max=4194304
      - net.core.wmem_max=4194304
      - net.core.somaxconn=65535
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  dragonfly:
    image: docker.dragonflydb.io/dragonfly/dragonfly
    container_name: irongrid-dragonfly
    restart: unless-stopped
    # --maxmemory must be >= 256MiB per proactor thread (2 x 256MiB = 512mb)
    command: >-
      --cache_mode=true
      --maxmemory=512mb
      --proactor_threads=2
      --port=6379
    ports:
      - "127.0.0.1:6379:6379"   # only reachable from the host / other containers
    volumes:
      - dragonfly-data:/data

volumes:
  irongrid-data:
  dragonfly-data:
