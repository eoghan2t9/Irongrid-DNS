name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  # A re-push of the same tag / a manual re-run supersedes the previous run;
  # different tags are different groups, so they never cancel each other.
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  actions: write # artifact upload/download between jobs

jobs:
  # ---- frontend: lint, test and build the React dashboard, then hand the
  # fresh web/dist to the release job as an artifact. Runs in parallel with
  # the Go checks — nothing there needs a rebuilt frontend (the committed
  # web/dist/index.html placeholder satisfies go:embed all:dist).
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node (frontend)
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Lint, test and build the dashboard (embedded into the binary)
        run: |
          cd web
          npm ci --no-audit --no-fund
          npm run lint
          npm test
          npm run build

      - name: Upload web/dist for the release job
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  # ---- checks: golangci-lint, govulncheck, vet and the race tests.
  # Deliberately NOT a dependency of the release job — the release publishes
  # as soon as the binaries cross-compile and smoke-test clean, while these
  # run in parallel and report on this job. A tag push is no longer held
  # hostage by the slowest checks; fix anything they flag in the next
  # release (they still run on every release, so nothing silently regresses).
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # go.mod requires go 1.27; govulncheck reports 0 vulnerabilities
          # against 1.27.0. Keep in sync with ci.yml.
          go-version: '1.27.0'
          # Cache the Go module + build caches so every job doesn't compile
          # the world from scratch.
          cache: true

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.0

      - name: Scan for known vulnerabilities (govulncheck)
        run: |
          # Pinned via the go.mod tool directive so the tool itself is
          # deterministic and reuses the Go module cache instead of
          # re-resolving @latest on every run.
          go tool govulncheck ./...

      - name: Verify tests (race detector, incl. PTY-driven installer E2E)
        run: |
          go vet ./...
          go test -race ./...

  # ---- release: cross-compile every platform with the fresh web/dist,
  # smoke-test, write the changelog, publish the GitHub release, then build
  # and push the GHCR image. Gated on the frontend build only.
  release:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history for the changelog's git-log ranges.
          fetch-depth: 0

      - name: Download fresh web/dist
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # go.mod requires go 1.27; keep in sync with the checks job above.
          go-version: '1.27.0'
          cache: true

      - name: Derive version metadata
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Collect a PGO profile from the query-path benchmarks on the runner
      # (linux/amd64). PGO profiles are symbol-based, so this one profile
      # applies to every cross-compile target below — the release binaries
      # ship with profile-guided optimization at no extra per-platform cost.
      - name: Collect PGO profile
        run: |
          go test ./internal/dnsserver -run '^$' \
            -bench 'BenchmarkHandler(UpstreamMiss|CacheHit)$' -benchtime=10s \
            -cpuprofile pgo.pprof
          ls -lh pgo.pprof

      - name: Cross-compile all platforms (PGO)
        env:
          LDFLAGS: >-
            -s -w
            -X github.com/eoghan2t9/Irongrid-DNS/internal/version.Version=${{ steps.meta.outputs.version }}
            -X github.com/eoghan2t9/Irongrid-DNS/internal/version.Commit=${{ steps.meta.outputs.commit }}
            -X github.com/eoghan2t9/Irongrid-DNS/internal/version.BuildTime=${{ steps.meta.outputs.built }}
        run: |
          set -e
          mkdir -p dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${t%%/*}; arch=${t##*/}
            ext=""; [ "$os" = "windows" ] && ext=".exe"
            name="irongrid-${os}-${arch}${ext}"
            echo "  -> ${name}"
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" \
              go build -trimpath -pgo=pgo.pprof -ldflags "${LDFLAGS}" \
              -o "dist/${name}" ./cmd/irongrid
          done
          # Extra opt-in builds for modern x86_64 (AVX2/BMI2 etc via
          # GOAMD64=v3), purely additive alongside the baseline amd64
          # builds above — arm64 has no GOAMD64 concept.
          for t in linux/amd64 darwin/amd64 windows/amd64; do
            os=${t%%/*}; arch=${t##*/}
            ext=""; [ "$os" = "windows" ] && ext=".exe"
            name="irongrid-${os}-${arch}-v3${ext}"
            echo "  -> ${name} (GOAMD64=v3)"
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" GOAMD64=v3 \
              go build -trimpath -pgo=pgo.pprof -ldflags "${LDFLAGS}" \
              -o "dist/${name}" ./cmd/irongrid
          done
          cd dist && sha256sum irongrid-* > SHA256SUMS.txt

      - name: Smoke-test the linux binary
        run: |
          ./dist/irongrid-linux-amd64 -version
          ./dist/irongrid-linux-amd64-v3 -version

      # ---- changelog ----
      - name: Generate changelog
        id: changelog
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -z "$PREV" ]; then
            RANGE="HEAD"
            COMPARE_URL="https://github.com/eoghan2t9/Irongrid-DNS/commits/${{ github.ref_name }}"
            echo "Previous tag: none (first release)"
          else
            RANGE="${PREV}..HEAD"
            COMPARE_URL="https://github.com/eoghan2t9/Irongrid-DNS/compare/${PREV}...${{ github.ref_name }}"
            echo "Previous tag: ${PREV}"
          fi
          {
            echo "## What's Changed"
            echo ""
            sec() { git log --pretty=format:'- %h %s' "$RANGE" --grep="^$1" -i; }
            feat=$(sec feat)
            fix=$(sec fix)
            docs=$(sec docs)
            chore=$(sec chore)
            [ -n "$feat" ] && { echo "### ✨ Features"; echo "$feat"; echo ""; }
            [ -n "$fix" ] && { echo "### 🐛 Fixes"; echo "$fix"; echo ""; }
            [ -n "$docs" ] && { echo "### 📚 Docs"; echo "$docs"; echo ""; }
            [ -n "$chore" ] && { echo "### 🔧 Chores"; echo "$chore"; echo ""; }
            echo "**Full Changelog**: $COMPARE_URL"
          } > CHANGELOG.md
          echo "--- changelog preview ---"
          cat CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Irongrid DNS ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: dist/*

      # ---- GHCR container image (linux/amd64 + linux/arm64) ----
      # The image is built from Dockerfile.runtime, which packages the
      # natively cross-compiled binary from dist/ instead of recompiling Go
      # under QEMU — keeping the image build to seconds.
      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare per-arch build context
        run: |
          mkdir -p .image-context
          cp dist/irongrid-linux-amd64 .image-context/irongrid-linux-amd64
          cp dist/irongrid-linux-arm64 .image-context/irongrid-linux-arm64

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .image-context
          file: Dockerfile.runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/eoghan2t9/irongrid-dns:${{ github.ref_name }}
            ghcr.io/eoghan2t9/irongrid-dns:latest
